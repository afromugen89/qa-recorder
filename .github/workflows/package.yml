name: Package for Windows

# Builds the portable Windows zip (Node.js and Chromium included).
# - Run it by hand from the Actions tab ("Run workflow") to get the zip as a
#   build artifact.
# - Push a tag like v0.2.0 to also publish the zip as a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: qa-recorder-windows
          path: release/*.zip
          compression-level: 0
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip --title "QA Recorder $GITHUB_REF_NAME" --generate-notes
