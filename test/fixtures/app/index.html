<!doctype html>
<html>
<head><meta charset="utf-8"><title>QA recorder demo</title></head>
<body>
  <h1>Demo shop</h1>
  <form id="customer" onsubmit="event.preventDefault()">
    <label for="email">Email</label>
    <input id="email" type="email">
    <label for="password">Password</label>
    <input id="password" type="password">
    <label for="country">Country</label>
    <select id="country">
      <option value="">Choose</option>
      <option value="my">Malaysia</option>
      <option value="sg">Singapore</option>
    </select>
    <fieldset>
      <legend>Plan</legend>
      <label><input type="radio" name="plan" value="basic"> Basic</label>
      <label><input type="radio" name="plan" value="pro"> Pro</label>
    </fieldset>
    <label><input type="checkbox" id="terms"> Accept terms</label>
    <textarea name="notes" placeholder="Notes"></textarea>
  </form>

  <button data-testid="save-btn" onclick="fetch('/api/ok', { method: 'POST', body: JSON.stringify({ a: 1 }) })">Save</button>
  <button onclick="fetch('/api/fail').then(() => console.error('Order failed to load'))">Load orders</button>
  <button onclick="fetch('/api/slow')">Slow report</button>
  <button onclick="setTimeout(() => { throw new Error('Boom from demo') })">Crash</button>
  <button class="dup">Delete</button>
  <button class="dup">Delete</button>

  <open-widget></open-widget>
  <closed-widget></closed-widget>

  <iframe id="same-frame" title="Same origin" src="/frame.html"></iframe>
  <iframe id="cross-frame" title="Cross origin" src="__CROSS_ORIGIN__/frame.html"></iframe>

  <script>
    customElements.define('open-widget', class extends HTMLElement {
      constructor() {
        super();
        const root = this.attachShadow({ mode: 'open' });
        root.innerHTML = '<input placeholder="Shadow search"><button>Shadow go</button>';
      }
    });
    customElements.define('closed-widget', class extends HTMLElement {
      constructor() {
        super();
        const root = this.attachShadow({ mode: 'closed' });
        root.innerHTML = '<button style="width:200px;height:40px">Closed action</button>';
      }
    });
  </script>
</body>
</html>
