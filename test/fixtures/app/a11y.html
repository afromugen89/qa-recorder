<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Accessibility demo</title>
  <link rel="stylesheet" href="__CROSS_ORIGIN__/wide.css">
  <style>
    body { font-family: sans-serif; margin: 8px; }
    .faint { color: #bbb; background: #fff; }
    .banner { width: 640px; height: 40px; background: #eef; }
    .tiny { width: 16px; height: 16px; padding: 0; font-size: 9px; }
    .stack { position: relative; height: 40px; }
    .stack button { position: absolute; top: 0; width: 80px; height: 32px; }
    .stack .second { left: 40px; }
    .fine-print { font-size: 10px; }
    @media (min-width: 768px) { .nav { display: flex; } }
    @media (max-width: 1023.98px) { .side { display: none; } }
  </style>
</head>
<body>
  <h1>Checkout</h1>
  <img src="data:," width="40" height="40">
  <p class="faint">Low contrast text that is hard to read.</p>
  <input type="text" placeholder="Coupon">
  <button id="icon-only"><svg width="12" height="12" aria-hidden="true"></svg></button>
  <div class="banner">Fixed width promo banner</div>
  <button class="tiny" aria-label="Close">x</button>
  <div class="stack"><button class="first">Pay now</button><button class="second">Cancel</button></div>
  <p class="fine-print">Terms and conditions apply.</p>
  <iframe title="Payment" src="/a11y-frame.html" width="200" height="80"></iframe>
</body>
</html>
